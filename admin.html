<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Lista del cumple</title>
  <link rel="icon" type="image/png" href="assets/icono.png?v=8">
  <link rel="apple-touch-icon" href="assets/icono-180.png?v=8">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Manrope:wght@400;600;700&family=Space+Mono:wght@400;700&display=swap">
  <link rel="stylesheet" href="assets/styles.css?v=8">
</head>
<body>
  <main class="pagina">
    <section class="seccion">
      <p class="etiqueta">Cumple de Fer · 14 nov</p>
      <h2>Lista de invitados</h2>
      <form class="login" id="login">
        <input id="clave" type="password" autocomplete="current-password" placeholder="Clave de admin" aria-label="Clave de admin" required>
        <button class="boton" type="submit">Ver lista</button>
      </form>
      <p class="estado" id="estado" role="status" aria-live="polite"></p>
    </section>

    <div id="panel" class="seccion" hidden>
      <div class="resumen">
        <div><strong id="n-si" style="--c: var(--verde)">0</strong><span>Van</span></div>
        <div><strong id="n-no" style="--c: var(--rojo)">0</strong><span>No van</span></div>
        <div><strong id="n-pend" style="--c: var(--tenue)">0</strong><span>Sin responder</span></div>
      </div>

      <section class="seccion"><p class="etiqueta" style="color: var(--verde)">Van</p><ul class="lista" id="l-si"></ul></section>
      <section class="seccion"><p class="etiqueta" style="color: var(--rojo)">No van</p><ul class="lista" id="l-no"></ul></section>
      <section class="seccion"><p class="etiqueta" style="color: var(--tenue)">Sin responder</p><ul class="lista" id="l-pend"></ul></section>
    </div>
  </main>

  <script src="assets/config.js?v=8"></script>
  <script src="assets/admin.js?v=8"></script>
</body>
</html>
